spring.application.name=Ejercicio5Cliente
server.port=8082
# URL del microservicio backend (se puede sobrescribir con la variable de entorno GESTOR_API_URL)
gestor.api.url=${GESTOR_API_URL:http://localhost:8081}
# Monitoreo (Actuator + Micrometer): solo se exponen health, info y metricas Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
