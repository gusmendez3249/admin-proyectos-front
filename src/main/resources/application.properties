spring.application.name=Ejercicio5Cliente
server.port=8082
# URL del microservicio backend (se puede sobrescribir con la variable de entorno GESTOR_API_URL)
gestor.api.url=${GESTOR_API_URL:http://localhost:8081}
# Monitoreo (Actuator + Micrometer). Los endpoints de administracion van en un puerto interno
# (MANAGEMENT_PORT) que no se publica fuera de la red de Docker: solo Prometheus y el HEALTHCHECK lo usan.
# Hallazgo de Semgrep (spring-actuator-dangerous-endpoints-enabled), ver bitacora #14.
management.server.port=${MANAGEMENT_PORT:9082}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
